<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select,Textarea and Buttons</title>
</head>
<body>
    <form action="">
        <lable for="course">Course:</lable>
        <select branch="course" id="course">
            <option value="ECE">ECE</option>
         <option value="CSE">CSE</option>
            <option value="ELC">ELC</option>
               <option value="CIVIL">CIVIL</option>
        </select>
        <p>
        <lable for="feedback">Feedback:</lable>
        <textarea id="feedback" rows="5" cols="25" name="feedback" placeholder="write here.."></textarea>
        </p>
        <p>
            <lable for="submit"></lable>
            <input type="submit" id="submit" name="submit">
            <input type="reset" id="reset" name="reset">
            <input type="submit" id="click me" name="click me">
        </p>
    </form>
    
</body>
</html>
