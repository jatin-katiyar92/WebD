<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form:Input Elements,Lable and Fieldset</title>
</head>
<body>
    <caption>personal details</caption>
    <form action="">
        <lable for="name">Name:</lable>
        <input type="text" id="name" >
        <p>
            <lable for="email">Email:</lable>
            <input type="email"  id="email">
        </p>
        <p>
            <lable for="password">Password:</lable>
            <input type="password" id="password">
        </p>
        <p>
            <lable for="gender">Gender:</lable>
            <lable for="male">Male</lable>
            <input type="radio" id="male" name="gender">
            <lable for="female">Female</lable>
            <input type="radio" id="female" name="gender">
        </p>
        <p>
            <lable for="hobbies">Hobbies:</lable>
            <lable for="reading">Reading</lable>
            <input type="checkbox" id="reading">
            <lable for="coding">coding</lable>
            <input type="checkbox" id="coding">

        </p>
        <lable for="DOB">DOB:</lable>
        <input type="number" id="number">
    </form>
    
</body>
</html>
