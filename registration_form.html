<!DOCTYPE html>
<html>
    <head>
        <title>Registration Form</title>
    </head>
    <body align="center">
        <h1 >Registration Form</h1>
        <form action="/thankyou.html" method="" target="" name="registrationform">
            <lable for="firstName">First Name</lable>
<input type="text" id="firstName" maxlength="50" minlength="5" placeholder="jatin" required>
<br>

<!--Last Name-->
<lable for="lastName" >Last Name</lable>
<input type="text" id="lastName" maxlenght="50" minlength="5" placeholder="katiyar">
<br>
<!--age-->
<lable for="age">Age</lable>
<input type="number" id="age" name="age" min="16" max="25" placeholder="00">
<br>
<!--Phone Number-->
<lable for="Phone">Phone No</lable>
<input type="tel" id="PhoneNumber" maxlength="20" minlength="5" placeholder="0124356">
<br>
<!--Email-->
<lable for="Email">Email</lable>
<input type="Email" id="Email"  placeholder="jk@gmail.com">
<br>
<!--Gender-->
<lable for="male">Male</lable>
<input type="radio" id="male" name="gender">
<lable for="female">Female</lable>
<input type="radio" id="female" name="gender">
<br>
<lable for="stream">Choose stream</lable>
<select name="stream" id="stream">
    <option value="arts">Arts</option>
    <option value="pcm">PCM</option>
    <option value="pcb">PCB</option>

</select>
<br>
<!--password-->
<lable for="password">Password</lable>
<input type="password" id="password" maxlength="15" minlength="8" required>
<br>
<!--hobbies-->
<lable for="hobbies">Hobbies</lable>
<textarea name="hobbies" id="hobbies" placeholder="write your hobbies" row="5" cols="20"></textarea>
<br>
<!--submit Button-->
<input type="submit" value="Register">
&nbsp;&nbsp;&nbsp;
<input type="reset" value="Reset"
<br>
        </form>

    </body>
</html>
